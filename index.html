<!DOCTYPE html>
<html>
<head>
    <title>Wizard101 Spell Maker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="OtherImages/favicon.png">
    <meta name="google-site-verification" content="92SsFOd-SciIf54EPaa4QbDMrNoxlWO6Dov5akYMlyQ" />
</head>
<body>
    <p></p>
    <div class="introduction">
        <h1>Wizard101 Spell Maker</h1>
        <p>Wizard101 spell maker using raw art instead of images of other cards</p>
        <p>Spellement paths are not yet included (Last Updated 23-09-2026)</p>
        <p>Contact: kellertitanthief@gmail.com</p>
    </div>
    <p></p>
    <div class="workspace">
        <div class="blank-space"></div>
        <div class="card-frame2" id="card-frame2">
            <div class="card-frame" id="card-frame">
                <div id="card-spiral" class="card-spiral"></div>
                <div class="user-image-wrapper" id="user-image-wrapper">
                    <div id="user-image"></div>
                </div>

                <img id="display-card" src="SpellBack/balance.png" alt="Death Card" class="card">
                <div class="weaving-display" id="weaving-display"></div>
                <div class="nameplate" id="nameplate">Spell</div>
                <div class="accuracy" id="accuracy"></div>
                <div class="rank" id="rank"></div>
                <div class="school" id="school"></div>
                <div class="type" id="type"></div>
                <div class="pip1" id="pip1"></div>
                <div class="pip2" id="pip2"></div>
                <div class="pip3" id="pip3"></div>
                <div class="description" id="description">Description text here.</div>
                <div class="central-restrict" id="central-restrict"></div>
                <div class="right-restrict" id="right-restrict"></div>
            </div>
            <div class="fusion-block" id="fusion-block">
                <div class="card-frame" id="card-frame-fusion">
                    <div id="card-spiral-fusion" class="card-spiral"></div>
                    <div class="user-image-wrapper" id="user-image-wrapper2">
                        <div id="user-image2"></div>
                    </div>

                    <div class="central-restrict" id="central-restrict"></div>
                    <div class="right-restrict" id="right-restrict"></div>
                </div>

                <div class="card-frame" id="card-frame-fusion2">
                    <div id="card-spiral-fusion" class="card-spiral"></div>
                    <div class="user-image-wrapper" id="user-image-wrapper3">
                        <div id="user-image3"></div>
                    </div>

                    <div class="central-restrict" id="central-restrict"></div>
                    <div class="right-restrict" id="right-restrict"></div>
                </div>
            </div>
        </div>
        
        <div class="icon-bank" id="icon-bank"></div>

        <div class="restriction-bank" id="restriction-bank"></div>
        <div class="blank-space"></div>
    </div>

    <div class="workspace2">
        <input type="file" accept="image/*" id="art-input">
        <select id="weaving-select">
            <option value="no-weaving">Weaving</option>
            <option value="fire-weaving">Fire</option>
            <option value="storm-weaving">Storm</option>
            <option value="ice-weaving">Ice</option>
            <option value="balance-weaving">Balance</option>
            <option value="death-weaving">Death</option>
            <option value="myth-weaving">Myth</option>
            <option value="life-weaving">Life</option>
            <option value="star-weaving">Star</option>
            <option value="sun-weaving">Sun</option>
            <option value="moon-weaving">Moon</option>
            <option value="shadow-weaving">Shadow</option>
        </select>
        <select id="target-select">
            <option value="school">School</option>
            <option value="type">Type</option>
            <option value="pip">Pip</option>
            <option value="image">Image</option>
            <option value="description">Description</option>
        </select>
        <select id="image-location">
            <option value="main-location">Main</option>
            <option value="fusion-one">Fusion A</option>
            <option value="fusion-two">Fusion B</option>
        </select>
    </div>
    
    <p></p>
    <input type="text" id="name-input" placeholder="Spell name">
    <input type="text" id="accuracy-input" placeholder="Spell accuracy">
    <input type="text" id="rank-input" placeholder="Spell rank">
    <div class="description-workspace" id="description-workspace">
        <div id="description-input" contenteditable="true" class="rich-input"></div>
        <div class="color-swatches">
            <div class="swatch" id="swatch-black" style="background-color: black;"></div>
            <div class="swatch" id="swatch-purple" style="background-color: rgb(105, 24, 64);"></div>
            <div class="swatch" id="swatch-white" style="background-color: white;"></div>
            <input type="color" id="custom-color-picker" style="display: none;">
        </div>
    </div>

    <label>Move X <input type="range" id="art-x" min="-300" max="300" value="50"></label>
    <label>Move Y <input type="range" id="art-y" min="-300" max="300" value="50"></label>
    <label>Move Z <input type="range" id="art-scale" min="10" max="500" value="100"></label>
    <label>Rotate <input type="range" id="art-rotate" min="-180" max="180" value="0"></label>
    <button id="mirror" class="mirror">Mirror</button>

    <div id="preset-image-bank"></div>
    
    <p></p>
    <div id="circle-container"></div>
    <div id="circle-container2"></div>
    <div id="circle-container3"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
